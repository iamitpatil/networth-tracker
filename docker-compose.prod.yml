services:
  postgres:
    image: postgres:16-alpine
    container_name: networth-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-networth}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-networth}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: networth-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: networth-llm
    volumes:
      - ${MODEL_DIR:-./models}:/models:ro
    command: >
      --model /models/${AI_MODEL_FILE:-gemma-4-E4B-it-Q4_K_M.gguf}
      --host 0.0.0.0
      --port 8082
      --ctx-size ${AI_CTX_SIZE:-32768}
      --threads ${AI_THREADS:-8}
      --no-mmap
      --no-warmup
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8082/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${LLM_MEMORY_LIMIT:-8g}
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: networth-app
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: production
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-networth}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      UPLOAD_DIR: /app/uploads
      AI_SERVER_URL: http://llm:8082/v1/chat/completions
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      llm:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - app_uploads:/app/uploads
      - app_logs:/app/logs
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: networth-web
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:
  app_uploads:
  app_logs:

networks:
  backend:
    driver: bridge
