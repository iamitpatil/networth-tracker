spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# The main profile pins the PostgreSQL dialect, which the test profile inherited: H2 was being handed
# `jsonb`, `serial` and an unquoted `value`, so roughly a dozen tables silently failed to be created
# and any test that touched one got "Table not found". Nothing noticed while every test mocked its
# repositories. Naming H2's own dialect here, and letting Hibernate quote H2's reserved words, gives
# back all but four tables -- audit_logs, form16_data, itr_filings, cc_spend_reports and
# reference_data hardcode `columnDefinition = "jsonb"`, which no dialect setting can translate. Flyway
# still owns the real schema, so this affects tests only.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.auto_quote_keyword=true

spring.data.redis.url=redis://localhost:6379

spring.mail.host=localhost
spring.mail.port=3025

