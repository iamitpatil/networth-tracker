# Production Configuration
spring.config.import=optional:file:.env[.properties]

# Server
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Redis
spring.data.redis.url=${REDIS_URL}
spring.cache.type=redis

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=86400000

# Market Data
market.data.yahoo.base-url=https://query1.finance.yahoo.com/v8/finance/chart
market.data.amfi.nav-url=https://www.amfiindia.com/spages/NAVAll.txt

# Broker APIs
broker.zerodha.api-key=${ZERODHA_API_KEY}
broker.zerodha.api-secret=${ZERODHA_API_SECRET}
broker.zerodha.redirect-uri=${ZERODHA_REDIRECT_URI}

# Email
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Upstox Market Data
market.data.upstox.access-token=${UPSTOX_ANALYTICS_TOKEN}

# Rate Limiting
rate.limit.default=100
rate.limit.window-minutes=15

# Logging
logging.level.com.networth=INFO
logging.level.org.springframework.security=WARN
logging.file.name=/var/log/networth-tracker/app.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
