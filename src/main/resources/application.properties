spring.application.name=networth-tracker

# Server
server.port=8080

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/networth}
spring.datasource.username=${DB_USERNAME:amitpatil}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
# The market and tax jurisdiction this deployment serves -- NOT a user preference. Financial-year
# boundaries, exchange hours and every cron follow it, because those are facts about the Indian
# market and no browser is involved in a scheduled job. Instants are stored in UTC and rendered in
# the viewer's own zone by the browser; business dates are stored without a zone at all. See
# MarketCalendar.
app.market-timezone=${APP_MARKET_TIMEZONE:Asia/Kolkata}

# Browser origins allowed to call the API. Dev default covers the Vite dev server and the
# containerised web app; production must set CORS_ALLOWED_ORIGINS to the real hostname.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.cache.type=redis

# JWT
jwt.secret=${JWT_SECRET:Y2hhbmdlLXRoaXMtdG8tYS1sb25nLXNlY3VyZS1rZXktaW4tcHJvZHVjdGlvbi1lbnZpcm9ubWVudA}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:3600000}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:86400000}

# Market Data
market.data.yahoo.base-url=https://query1.finance.yahoo.com/v8/finance/chart
market.data.amfi.nav-url=https://www.amfiindia.com/spages/NAVAll.txt
market.data.alpha-vantage.api-key=${ALPHA_VANTAGE_API_KEY:}
market.data.alpha-vantage.base-url=https://www.alphavantage.co/query

# Rate Limiting
rate.limit.default=100
rate.limit.window-minutes=15

# Actuator
management.health.mail.enabled=false
management.endpoints.web.exposure.include=health,info

# Swagger / OpenAPI
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.persist-authorization=true

# File Uploads
app.upload.dir=${UPLOAD_DIR:./uploads}
app.encryption.key=${FILE_ENCRYPTION_KEY:}

# Mail
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:3025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# File size
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Google OAuth (Gmail monitoring — optional)
google.oauth.client-id=${GOOGLE_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:}
google.oauth.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/gmail/callback}

# Token encryption (AES-256 key, 32 chars — optional)
token.encryption.key=${TOKEN_ENCRYPTION_KEY:}

# Upstox Market Data (Analytics Token — no rate limits)
market.data.upstox.access-token=${UPSTOX_ANALYTICS_TOKEN:}
market.data.upstox.base-url=https://api.upstox.com/v3

# Upstox Broker Integration (OAuth — for importing user holdings)
broker.upstox.client-id=${UPSTOX_CLIENT_ID:}
broker.upstox.client-secret=${UPSTOX_CLIENT_SECRET:}
broker.upstox.redirect-uri=${UPSTOX_REDIRECT_URI:http://localhost:3000/holdings}

# Zerodha Broker Integration (Kite Connect OAuth — for importing user holdings)
broker.zerodha.api-key=${ZERODHA_API_KEY:}
broker.zerodha.api-secret=${ZERODHA_API_SECRET:}
broker.zerodha.redirect-uri=${ZERODHA_REDIRECT_URI:http://localhost:3000/holdings}

# ── AI Configuration ──
ai.server-url=${AI_SERVER_URL:http://localhost:8082/v1/chat/completions}
ai.model=${AI_MODEL:llama}
ai.temperature=${AI_TEMPERATURE:0.1}
ai.connect-timeout-ms=${AI_CONNECT_TIMEOUT:120000}
ai.read-timeout-ms=${AI_READ_TIMEOUT:300000}
ai.max-tool-rounds=${AI_MAX_TOOL_ROUNDS:3}
ai.tool-result-max-chars=${AI_TOOL_RESULT_MAX_CHARS:5000}
ai.max-session-messages=${AI_MAX_SESSION_MESSAGES:50}
ai.pending-action-expiry-days=${AI_PENDING_ACTION_EXPIRY_DAYS:7}
ai.sse-timeout-ms=${AI_SSE_TIMEOUT:600000}
ai.stream-tokens=${AI_STREAM_TOKENS:true}

# Feature Flags
features.upstox-import=${FEATURE_UPSTOX_IMPORT:true}
features.zerodha-import=${FEATURE_ZERODHA_IMPORT:true}
features.ai-chat=true
features.news=true
features.dividends=true
features.family-view=true
features.gmail-sync=false

# NPS NAV (npsnav.in — free, no auth)
nps.nav.base-url=${NPS_NAV_BASE_URL:https://npsnav.in/api}

# ── Symbol reference lists ──
# Every equity, ETF, mutual fund and NPS ticker a user can save is checked against these lists, and an
# unrecognised one is rejected outright. That makes the lists load-bearing: an empty category would
# refuse every symbol in it, so a category with no rows is loaded before the app accepts traffic
# (blocking readiness), while one merely older than max-age refreshes in the background. Only the
# missing rows are inserted, so a warm boot is five indexed counts rather than a 22,000-row rewrite.
# Set bootstrap-enabled=false for tests and a fast dev loop; the lists then stay as they are on disk.
app.symbols.bootstrap-enabled=${SYMBOLS_BOOTSTRAP_ENABLED:true}
app.symbols.max-age=${SYMBOLS_MAX_AGE:7d}

# Market Data Provider Chains (comma-separated, tried in order)
market.providers.price=upstox,yahoo,alpha-vantage
market.providers.mf-nav=upstox-mf,amfi
market.providers.dividend=nse,yahoo
market.providers.news=google

# ── Provider rate limits ──
# Defaults live in ProviderRateLimits, which records each provider's PUBLISHED limit next to the
# budget enforced here (roughly 80% of documented, and well under it where nothing is published).
# GET /api/v1/market/providers reports both plus live usage. Override individual windows, e.g.
#   market.ratelimit.providers.alpha-vantage.per-day=500     (a paid Alpha Vantage key)
#   market.ratelimit.providers.upstox.per-second=50          (use the full documented burst)
# market.ratelimit.enabled=false disables enforcement entirely, restoring the previous behaviour.
market.ratelimit.enabled=${MARKET_RATELIMIT_ENABLED:true}
# How long a background caller (the price-history backfill) waits for a slot before skipping a
# symbol. The live read path never waits; it falls through to the next provider in the chain.
market.ratelimit.max-wait=${MARKET_RATELIMIT_MAX_WAIT:2s}

# ── Price freshness ──
# One policy decides when a stored price is worth re-fetching, and every path asks it: the 5-minute
# sweep, the read behind the Holdings page, the Redis TTL, and the "as of" stamp on screen. Defaults
# live in PriceFreshnessPolicy, which classifies each asset type by how its prices come into
# existence -- an equity close stays current until the exchange reopens, a NAV until AMFI publishes
# the next one, and a fixed deposit forever. The ages below only decide how finely to sample a type
# that is priced continuously, so lengthening one cannot make a closing price look live.
#
#   market.price.max-age.equity=15m     (also ETF; sampled only while the session is open)
#   market.price.max-age.crypto=15m
#   market.price.max-age.gold=6h        (also SGB; the published retail rate barely moves)
#   market.price.nav-published-at=23:00 (when the day's NAVs appear, in the market's zone)
#
# Types left out keep their defaults, so tuning one cannot silently unbound the rest. Raising a max
# age above the sweep's 5-minute period is safe; a max age below it just refreshes on every tick.
