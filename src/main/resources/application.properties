spring.application.name=networth-tracker

# Server
server.port=8080

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/networth}
spring.datasource.username=${DB_USERNAME:amitpatil}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.cache.type=redis

# JWT
jwt.secret=${JWT_SECRET:Y2hhbmdlLXRoaXMtdG8tYS1sb25nLXNlY3VyZS1rZXktaW4tcHJvZHVjdGlvbi1lbnZpcm9ubWVudA}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:86400000}

# Market Data
market.data.yahoo.base-url=https://query1.finance.yahoo.com/v8/finance/chart
market.data.amfi.nav-url=https://www.amfiindia.com/spages/NAVAll.txt
market.data.alpha-vantage.api-key=${ALPHA_VANTAGE_API_KEY:}
market.data.alpha-vantage.base-url=https://www.alphavantage.co/query

# Rate Limiting
rate.limit.default=100
rate.limit.window-minutes=15

# Actuator
management.health.mail.enabled=false
management.endpoints.web.exposure.include=health,info

# Swagger / OpenAPI
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.persist-authorization=true

# File Uploads
app.upload.dir=${UPLOAD_DIR:./uploads}

# Mail
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:3025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# File size
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Google OAuth (Gmail monitoring — optional)
google.oauth.client-id=${GOOGLE_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:}
google.oauth.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/gmail/callback}

# Token encryption (AES-256 key, 32 chars — optional)
token.encryption.key=${TOKEN_ENCRYPTION_KEY:}

# Upstox Market Data (Analytics Token — no rate limits)
market.data.upstox.access-token=${UPSTOX_ANALYTICS_TOKEN:}
market.data.upstox.base-url=https://api.upstox.com/v3

# Upstox Broker Integration (OAuth — for importing user holdings)
broker.upstox.client-id=${UPSTOX_CLIENT_ID:}
broker.upstox.client-secret=${UPSTOX_CLIENT_SECRET:}
broker.upstox.redirect-uri=${UPSTOX_REDIRECT_URI:http://localhost:3000/holdings}

# Feature Flags
features.upstox-import=${FEATURE_UPSTOX_IMPORT:false}
features.zerodha-import=${FEATURE_ZERODHA_IMPORT:false}
features.ai-chat=true
features.news=true
features.dividends=true
features.family-view=true
features.gmail-sync=false

# Market Data Provider Chains (comma-separated, tried in order)
market.providers.price=upstox,yahoo,alpha-vantage
market.providers.mf-nav=upstox-mf,amfi
market.providers.dividend=nse,yahoo
market.providers.news=google
