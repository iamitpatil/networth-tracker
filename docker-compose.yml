# Development — just infrastructure services
# Run the app and frontend locally (outside Docker)
#
# Usage:
#   docker compose up -d          # start postgres + redis
#   mvn spring-boot:run           # start backend on :8080
#   cd web && npm run dev         # start frontend on :3000

services:
  postgres:
    image: postgres:16-alpine
    container_name: networth-postgres
    environment:
      POSTGRES_DB: networth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: networth-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
