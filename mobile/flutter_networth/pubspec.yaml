name: flutter_networth
description: Cross-platform Net Worth Tracker mobile app

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.3
  provider: ^6.1.2
  equatable: ^2.0.5
  
  # HTTP Client
  http: ^1.1.0
  
  # Storage
  shared_preferences: ^2.2.2
  
  # UI Components
  fl_chart: ^0.66.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  
  # Icons
  cupertino_icons: ^1.0.6
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    # - assets/images/
    # - assets/icons/